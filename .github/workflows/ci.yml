# CI: every push to main and every pull request runs all test layers, then builds and
# smoke-tests the Docker images. A red ✗ on a commit means one of these failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secrets & dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: No secrets in tracked files
        run: ./scripts/check-secrets.sh
      - name: Production dependencies have no high/critical advisories
        run: |
          (cd server && npm audit --omit=dev --audit-level=high)
          (cd frontend && npm audit --omit=dev --audit-level=high)

  contracts:
    name: Contracts (Hardhat tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat test

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Mutation check (tests must catch 6 planted bugs)
        run: npm run check:mutations

  server:
    name: Server (typecheck, tests vs real Postgres + chain, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Mutation check (tests must catch 5 planted indexer bugs)
        run: npm run check:mutations

  e2e:
    name: End-to-end (browser → frontend → chain → indexer → API)
    needs: [frontend, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker (build images, run stack, smoke test)
    needs: [frontend, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f compose.yaml -f compose.local.yaml --env-file local.env
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the fully local stack
        run: $COMPOSE up -d --build
      - name: Smoke test (11 checks, as a browser sees it)
        run: ./scripts/docker-smoke.sh
      - name: Container logs (on failure)
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Stop
        if: always()
        run: $COMPOSE down -v
